name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy docs/ to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' \
            '138.197.180.211 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO8jjyKxvb2VBZ8Q6HZ8FUwD95V96ev6zRqBxhf2V2ZH' \
            > ~/.ssh/known_hosts
          rsync -avz --delete --exclude CNAME \
            docs/ jc@138.197.180.211:/home/jc/adayisaholidaycom/site/
