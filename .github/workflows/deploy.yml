name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "api/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: api/go.sum

      - name: Build API (linux amd64)
        working-directory: api
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/adayisaholiday-api ./cmd/server

      - name: Deploy to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' \
            '138.197.180.211 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO8jjyKxvb2VBZ8Q6HZ8FUwD95V96ev6zRqBxhf2V2ZH' \
            > ~/.ssh/known_hosts

          rsync -avz --delete --exclude CNAME \
            docs/ jc@138.197.180.211:/home/jc/adayisaholidaycom/site/

          ssh jc@138.197.180.211 'mkdir -p /home/jc/adayisaholidaycom/bin /home/jc/adayisaholidaycom/data'

          rsync -avz api/bin/adayisaholiday-api \
            jc@138.197.180.211:/home/jc/adayisaholidaycom/bin/adayisaholiday-api
          rsync -avz api/deploy/adayisaholiday-api.service \
            jc@138.197.180.211:/home/jc/.config/systemd/user/adayisaholiday-api.service

          ssh jc@138.197.180.211 '
            set -e
            if [ ! -f /home/jc/adayisaholidaycom/.env ]; then
              umask 077
              SECRET=$(openssl rand -hex 32)
              cat > /home/jc/adayisaholidaycom/.env <<EOF
LISTEN_ADDR=127.0.0.1:8083
DATABASE_PATH=/home/jc/adayisaholidaycom/data/accounts.db
PUBLIC_BASE_URL=https://adayisaholiday.com
COOKIE_SECURE=true
SESSION_TTL=720h
VERIFY_TTL=48h
RESET_TTL=2h
SESSION_SECRET=$SECRET
EXPOSE_VERIFY_TOKEN=false
MAIL_FROM=A Day Is a Holiday <noreply@adayisaholiday.com>
GIN_MODE=release
EOF
              chmod 600 /home/jc/adayisaholidaycom/.env
            fi
            systemctl --user daemon-reload
            systemctl --user enable --now adayisaholiday-api.service
            systemctl --user restart adayisaholiday-api.service
            systemctl --user is-active adayisaholiday-api.service
          '
